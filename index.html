<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="theme-color" content="#0b3b60">
  <link rel="icon" href="assets/img/main-profile.png" type="image/png">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <title></title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="siteRibbon" class="demo-ribbon" role="note" hidden>
    <i id="siteRibbonIcon" class="bi" aria-hidden="true"></i>
    <span id="siteRibbonText"></span>
  </div>

  <nav id="mainNav" class="navbar navbar-expand-xl navbar-dark fixed-top">
    <div class="container">
      <a id="brandHomeLink" class="navbar-brand d-flex align-items-center gap-2" href="#inicio">
        <span id="brandMark" class="brand-mark"></span>
        <span class="brand-copy">
          <strong id="brandName"></strong>
          <small id="brandSubtitle"></small>
        </span>
      </a>

      <div class="d-flex align-items-center gap-2 order-xl-3">
        <button id="themeToggle" class="btn btn-icon nav-icon" type="button">
          <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
        </button>
        <button id="navToggle" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
          aria-controls="navbarContent" aria-expanded="false">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse order-xl-2" id="navbarContent">
        <ul id="navItems" class="navbar-nav ms-auto me-xl-3 mb-2 mb-xl-0"></ul>
      </div>
    </div>
  </nav>

  <main>
    <section id="inicio" class="hero-section section-anchor" hidden>
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-orb hero-orb-one" aria-hidden="true"></div>
      <div class="hero-orb hero-orb-two" aria-hidden="true"></div>

      <div class="container hero-content">
        <div class="row align-items-center g-5">
          <div class="col-lg-7" data-aos="fade-up">
            <div id="heroEyebrow" class="eyebrow"><span aria-hidden="true"></span><span id="heroEyebrowText"></span></div>
            <h1 id="heroName"></h1>
            <p id="heroPeriod" class="hero-period"></p>
            <p id="heroDescription" class="hero-description"></p>
            <div id="heroActions" class="hero-actions"></div>
            <div id="heroHighlights" class="hero-proof"></div>
          </div>

          <div class="col-lg-5" data-aos="zoom-in" data-aos-delay="120">
            <div class="candidate-card">
              <div class="candidate-image-wrap">
                <img id="candidateImage" alt="" class="candidate-image" hidden>
                <span id="candidateBadge" class="mock-badge"></span>
              </div>
              <div class="candidate-meta">
                <span id="candidateTag" class="tag"></span>
                <h2 id="candidateCardTitle"></h2>
                <p id="candidateCardDescription"></p>
              </div>
            </div>
          </div>
        </div>

        <a id="scrollIndicator" class="scroll-indicator">
          <span id="scrollIndicatorText"></span>
          <i class="bi bi-mouse" aria-hidden="true"></i>
        </a>
      </div>
    </section>

    <section id="indicadores" class="stats-strip section-anchor" hidden>
      <div class="container">
        <div id="statsKicker" class="section-kicker text-center"></div>
        <div id="statsGrid" class="row g-3 justify-content-center"></div>
      </div>
    </section>

    <section id="perfil" class="section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading" data-aos="fade-up">
          <span id="profileKicker" class="section-kicker"></span>
          <h2 id="profileTitle"></h2>
          <p id="profileDescription" class="lead-copy"></p>
        </div>
        <div id="profileCards" class="row g-4 mt-2"></div>
        <div id="profileTimelineShell" class="timeline-shell mt-5" data-aos="fade-up">
          <div class="timeline-header">
            <div>
              <span id="profileTimelineKicker" class="section-kicker"></span>
              <h3 id="profileTimelineTitle"></h3>
            </div>
            <span id="profileTimelineChip" class="demo-chip"></span>
          </div>
          <div id="profileTimeline" class="timeline-grid"></div>
        </div>
      </div>
    </section>

    <section id="obras-impuestos" class="tax-works-section section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading" data-aos="fade-up">
          <span id="taxWorksKicker" class="section-kicker"></span>
          <h2 id="taxWorksTitle"></h2>
          <p id="taxWorksDescription" class="lead-copy"></p>
        </div>

        <div class="tax-proof mt-5" data-aos="fade-up">
          <div class="tax-proof-copy">
            <span id="taxProofPeriod" class="tax-proof-eyebrow"></span>
            <h3 id="taxProofTitle"></h3>
            <p id="taxProofDescription"></p>
            <div class="tax-proof-summary">
              <div class="tax-proof-stat">
                <strong id="taxProofProjectCount"></strong>
                <span id="taxProofProjectsLabel"></span>
              </div>
              <div class="tax-proof-areas">
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                <span id="taxProofAreas"></span>
              </div>
            </div>
          </div>
          <div class="tax-proof-amount">
            <span id="taxProofAmountLabel"></span>
            <strong id="taxProofHeadlineAmount"></strong>
            <small><span id="taxProofExactLabel"></span>: <span id="taxProofExactAmount"></span></small>
          </div>
        </div>

        <div class="tax-block-heading" data-aos="fade-up">
          <span id="taxWorksListKicker" class="section-kicker"></span>
          <h3 id="taxWorksListTitle"></h3>
          <p id="taxWorksListDescription" class="lead-copy"></p>
        </div>
        <div id="taxWorksGrid" class="row g-4"></div>

        <div class="tax-future-shell" data-aos="fade-up">
          <div class="tax-future-heading">
            <span id="taxFutureKicker" class="section-kicker"></span>
            <h3 id="taxFutureTitle"></h3>
            <p id="taxFutureDescription" class="lead-copy"></p>
            <span id="taxFuturePortfolioLabel" class="tax-portfolio-label"></span>
          </div>
          <div id="taxFutureGrid" class="row g-3"></div>
        </div>

        <div class="tax-closing" data-aos="zoom-in">
          <div>
            <span id="taxClosingEyebrow" class="tax-closing-eyebrow"></span>
            <h3 id="taxClosingTitle"></h3>
            <p id="taxClosingDescription"></p>
          </div>
          <div id="taxClosingPillars" class="tax-closing-pillars"></div>
        </div>
      </div>
    </section>

    <section id="cayma" class="section-pad bg-soft section-anchor" hidden>
      <div class="container">
        <div class="section-heading" data-aos="fade-up">
          <span id="districtKicker" class="section-kicker"></span>
          <h2 id="districtTitle"></h2>
          <p id="districtDescription" class="lead-copy"></p>
        </div>

        <div id="districtMetricsBlock" class="row g-4 align-items-stretch">
          <div id="districtChartColumn" class="col-lg-6" data-aos="fade-right">
            <div class="chart-card h-100">
              <div class="card-head">
                <div><span id="chartKicker" class="mini-label"></span><h3 id="chartTitle"></h3></div>
                <i class="bi bi-radar" aria-hidden="true"></i>
              </div>
              <div class="chart-wrap">
                <canvas id="caymaRadar"></canvas>
                <p id="chartFallback" class="lead-copy text-center" hidden></p>
              </div>
            </div>
          </div>
          <div class="col-lg-6" data-aos="fade-left">
            <div class="metric-card h-100">
              <div class="card-head">
                <div><span id="detailKicker" class="mini-label"></span><h3 id="detailTitle"></h3></div>
                <span id="detailChip" class="demo-chip"></span>
              </div>
              <div id="progressMetrics" class="progress-list"></div>
            </div>
          </div>
        </div>

        <div id="axisGrid" class="row g-4 mt-4"></div>
      </div>
    </section>

    <section id="propuestas" class="section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading d-lg-flex align-items-end justify-content-between gap-4" data-aos="fade-up">
          <div>
            <span id="proposalsKicker" class="section-kicker"></span>
            <h2 id="proposalsTitle"></h2>
            <p id="proposalsDescription" class="lead-copy mb-0"></p>
          </div>
          <span id="proposalsCount" class="demo-chip mt-3 mt-lg-0"></span>
        </div>
        <div id="proposalFilters" class="filter-bar mt-4"></div>
        <div id="proposalsGrid" class="row g-4 mt-2" aria-live="polite"></div>
      </div>
    </section>

    <section id="roadmap" class="roadmap-section section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading text-center" data-aos="fade-up">
          <span id="roadmapKicker" class="section-kicker light"></span>
          <h2 id="roadmapTitle"></h2>
          <p id="roadmapDescription" class="lead-copy light-copy mx-auto"></p>
        </div>
        <div id="roadmapYears" class="roadmap-years" data-aos="zoom-in"></div>
        <div id="roadmapStage" class="roadmap-stage" data-aos="fade-up" aria-live="polite"></div>
      </div>
    </section>

    <section id="proyectos" class="section-pad bg-soft section-anchor" hidden>
      <div class="container">
        <div class="section-heading" data-aos="fade-up">
          <span id="projectsKicker" class="section-kicker"></span>
          <h2 id="projectsTitle"></h2>
          <p id="projectsDescription" class="lead-copy"></p>
        </div>

        <div id="mapShell" class="map-shell" data-aos="fade-up" hidden>
          <div id="projectMap" role="region"></div>
          <div id="mapOverlay" class="map-overlay">
            <span id="mapOverlayLabel" class="mini-label"></span>
            <strong id="mapOverlayCount"></strong>
          </div>
        </div>

        <div id="featuredBlock" hidden>
          <div class="section-subheading mt-5">
            <div><span id="featuredKicker" class="section-kicker"></span><h3 id="featuredTitle"></h3></div>
            <div class="swiper-nav">
              <button id="featuredPrev" class="swiper-btn featured-prev" type="button"><i class="bi bi-arrow-left" aria-hidden="true"></i></button>
              <button id="featuredNext" class="swiper-btn featured-next" type="button"><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="swiper featuredSwiper mt-3">
            <div id="featuredWrapper" class="swiper-wrapper"></div>
            <div class="swiper-pagination featured-pagination"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="triptico" class="section-pad trifold-section section-anchor" hidden>
      <div class="container">
        <div class="section-heading text-center" data-aos="fade-up">
          <span id="trifoldKicker" class="section-kicker"></span>
          <h2 id="trifoldTitle"></h2>
          <p id="trifoldDescription" class="lead-copy mx-auto"></p>
        </div>
        <div class="trifold-toolbar" data-aos="fade-up">
          <button id="trifoldPrev" class="btn btn-outline-secondary" type="button"></button>
          <div class="trifold-center-actions">
            <button id="trifoldToggle" class="btn btn-primary" type="button"></button>
            <button id="trifoldPrint" class="btn btn-dark" type="button"></button>
          </div>
          <button id="trifoldNext" class="btn btn-outline-secondary" type="button"></button>
        </div>
        <div id="trifold" class="trifold folded" tabindex="0"></div>
        <p id="trifoldMobileHint" class="mobile-hint"></p>
      </div>
    </section>

    <section id="agenda" class="section-pad bg-soft section-anchor" hidden>
      <div class="container">
        <div class="section-heading d-lg-flex justify-content-between align-items-end gap-4" data-aos="fade-up">
          <div>
            <span id="agendaKicker" class="section-kicker"></span>
            <h2 id="agendaTitle"></h2>
            <p id="agendaDescription" class="lead-copy mb-0"></p>
          </div>
          <div id="eventFilters" class="filter-bar compact mt-3 mt-lg-0"></div>
        </div>
        <div id="eventsGrid" class="row g-4 mt-2" aria-live="polite"></div>
      </div>
    </section>

    <section id="galeria" class="section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading" data-aos="fade-up">
          <span id="publicationsKicker" class="section-kicker"></span>
          <h2 id="publicationsTitle"></h2>
          <p id="publicationsDescription" class="lead-copy"></p>
        </div>

        <div class="publications-grid" data-aos="fade-up">
          <article class="publication-card" aria-labelledby="facebookPublicationsTitle">
            <header class="publication-card-header">
              <span class="publication-platform-icon" aria-hidden="true"><i class="bi bi-facebook"></i></span>
              <div>
                <span class="mini-label">Facebook</span>
                <h3 id="facebookPublicationsTitle">Publicaciones recientes</h3>
              </div>
            </header>
            <div class="publication-embed publication-embed--facebook">
              <iframe id="facebookPageEmbed" title="Publicaciones recientes de la página de Facebook"
                width="500" height="680" scrolling="no" loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <footer class="publication-card-footer">
              <a id="facebookPublicationLink" class="publication-fallback-link" target="_blank" rel="noopener noreferrer"
                title="Abrir la página de Facebook en una pestaña nueva"
                aria-label="Ver las publicaciones en Facebook; se abre en una pestaña nueva">
                <span id="facebookPublicationLinkLabel">Ver en Facebook</span>
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </footer>
          </article>

          <article class="publication-card" aria-labelledby="tiktokPublicationsTitle">
            <header class="publication-card-header">
              <span class="publication-platform-icon" aria-hidden="true"><i class="bi bi-tiktok"></i></span>
              <div>
                <span class="mini-label">TikTok</span>
                <h3 id="tiktokPublicationsTitle">Publicaciones recientes</h3>
              </div>
            </header>
            <div id="tiktokEmbedShell" class="publication-embed publication-embed--tiktok"></div>
            <footer class="publication-card-footer">
              <a id="tiktokPublicationLink" class="publication-fallback-link" target="_blank" rel="noopener noreferrer"
                title="Abrir el perfil de TikTok en una pestaña nueva"
                aria-label="Ver las publicaciones en TikTok; se abre en una pestaña nueva">
                <span id="tiktokPublicationLinkLabel">Ver en TikTok</span>
                <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
              </a>
            </footer>
          </article>
        </div>
      </div>
    </section>

    <section id="redes" class="social-section section-pad section-anchor" hidden>
      <div class="container">
        <div class="section-heading text-center" data-aos="fade-up">
          <span id="socialsKicker" class="section-kicker light"></span>
          <h2 id="socialsTitle"></h2>
          <p id="socialsDescription" class="lead-copy light-copy mx-auto"></p>
        </div>
        <div id="socialGrid" class="social-grid" data-aos="zoom-in"></div>
      </div>
    </section>
  </main>

  <footer id="siteFooter" class="site-footer" hidden>
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="footer-brand">
            <span id="footerBrandMark" class="brand-mark"></span>
            <div><strong id="footerBrandName"></strong><span id="footerBrandSubtitle"></span></div>
          </div>
          <p id="footerDescription"></p>
        </div>
        <div>
          <h3 id="footerNavigationTitle"></h3>
          <div id="footerNavigation"></div>
        </div>
        <div>
          <h3 id="footerLegalTitle"></h3>
          <p id="footerLegalText" class="footer-notice"></p>
        </div>
      </div>
      <div class="footer-bottom">
        <span id="footerCopyright"></span>
        <span id="footerTechnology"></span>
      </div>
    </div>
  </footer>

  <div id="floatingActions" class="floating-actions" hidden>
    <button id="fabToggle" class="fab-main" type="button" aria-expanded="false">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
    </button>
    <div id="fabMenu" class="fab-menu" hidden></div>
  </div>

  <div class="modal fade" id="proposalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content project-modal">
        <div class="modal-header border-0">
          <div><span id="modalCategory" class="section-kicker"></span><h2 id="modalTitle" class="modal-title"></h2></div>
          <button id="proposalModalClose" type="button" class="btn-close" data-bs-dismiss="modal" data-close-modal="proposalModal"></button>
        </div>
        <div id="modalBody" class="modal-body pt-0"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="demo-toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
