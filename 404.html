<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página no encontrada | Harberth Zúñiga</title>

  <meta
    name="description"
    content="La página solicitada no se encuentra disponible."
  >

  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ed1c24">

  <link rel="icon" href="/assets/img/profile.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171717;
      color: #fff;
    }

    main {
      width: min(640px, 100%);
      text-align: center;
    }

    .code {
      margin: 0;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: 1;
      font-weight: 900;
      color: #ed1c24;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
    }

    p {
      margin: 0 auto 28px;
      max-width: 520px;
      color: #d5d5d5;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      background: #ed1c24;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover,
    a:focus-visible {
      background: #c8161d;
    }
  </style>
</head>

<body>
  <main>
    <p class="code" aria-hidden="true">404</p>

    <h1>Página no encontrada</h1>

    <p>
      El contenido que buscas no existe, fue movido o la dirección ingresada no es correcta.
    </p>

    <a href="https://hzuniga.net/">
      Volver al inicio
    </a>
  </main>
</body>
</html>
